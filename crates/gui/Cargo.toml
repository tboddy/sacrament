[package]
name = "sacrament-gui"
version = "0.1.0"
edition = "2024"

# v2 — the iced rebuild. Renamed to `sacrament` at the cutover, when the tui
# crate is deleted.
[[bin]]
name = "sacrament2"
path = "src/main.rs"

[dependencies]
sacrament-core = { path = "../core" }

anyhow.workspace = true
portable-pty.workspace = true
unicode-width.workspace = true
# `default-features = false` drops wgpu so the tiny-skia CPU renderer is used.
# Measured on this spike: ~150-160 MB RSS with wgpu vs the number in CLAUDE.md
# for tiny-skia. Toggle this to re-measure.
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "advanced", "basic-shaping"] }
alacritty_terminal = "0.26.0"
ttf-parser = "0.25"
notify = "8.2.0"
fontdb = { version = "0.23.0", default-features = false, features = ["fs"] }
rfd = "0.17.2"


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = "0.3"
