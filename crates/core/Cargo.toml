[package]
name = "sacrament-core"
version = "0.1.0"
edition = "2024"

# Deliberately depends on NO UI framework. ratatui/crossterm belong to the tui
# crate and iced to the gui crate; if either leaks in here, the seam is broken.
[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
unicode-width.workspace = true
pulldown-cmark = "0.13.3"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
