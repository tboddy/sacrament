[workspace]
resolver = "3"
members = ["crates/core", "crates/tui", "crates/gui"]

# Shared versions so v1 (tui) and v2 (gui) can't drift apart on a crate they
# both use. Add here, then reference with `dep.workspace = true`.
[workspace.dependencies]
anyhow = "1.0.102"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
unicode-width = "0.2.2"
